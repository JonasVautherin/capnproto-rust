[package]
name = "fd-passing"
version = "0.1.0"
edition = "2021"

build = "build.rs"

[[bin]]
name = "fd-passing"
path = "main.rs"

[build-dependencies]
capnpc = { path = "../../../capnpc" }

[dependencies]
capnp = { path = "../../../capnp" }
capnp-futures = { path = "../../../capnp-futures" }
futures = "0.3.0"
rustix = { version = "1", features = ["net"] }
tokio = { version = "1.0.0", features = ["net", "rt", "macros"]}

[dependencies.capnp-rpc]
path = "../.."

[lints]
workspace = true
